name: Docker Build & Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-images:
    name: Build Multi-Stage Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./agentpay/backend
          file: ./agentpay/backend/Dockerfile
          push: false
          tags: frame-backend:latest
          load: true

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./agentpay/frontend
          file: ./agentpay/frontend/Dockerfile
          push: false
          tags: frame-frontend:latest
          load: true
