# ==============================================================================
# Frame — Render Blueprint Specification (render.yaml)
# ==============================================================================

databases:
  - name: frame-postgres
    databaseName: frame
    user: frame
    plan: free

services:
  # Managed Redis Cache & Queue
  - type: redis
    name: frame-redis
    plan: free
    ipAllowList: []

  # Frame Backend API & Worker
  - type: web
    name: frame-backend
    env: node
    plan: free
    rootDir: agentpay/backend
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate:prod && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRAME_ENV
        value: production
      - key: PORT
        value: 3001
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: DATABASE_URL
        fromDatabase:
          name: frame-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: frame-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SALT
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # Frame Frontend Dashboard
  - type: web
    name: frame-frontend
    env: node
    plan: free
    rootDir: agentpay/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: frame-backend
          property: host
